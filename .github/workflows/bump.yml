name: Bump versions

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    shell: nu {0}

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: hustcer/setup-nu@95cd3bfe252450ef7d35dd9a7ddecf3484341134 # v3.28
        with:
          version: "0.116"

      - name: Run update script
        run: nu update.nu

      - name: Check for changes
        id: diff
        run: |
          let changed = (git diff --quiet versions.json | complete).exit_code != 0
          $"changed=($changed)\n" | save --append $env.GITHUB_OUTPUT
          if $changed { git --no-pager diff versions.json }

      - uses: DeterminateSystems/determinate-nix-action@e847f25223456b3058e12f7fc9d777b6a6f25060 # v3.23.2
        if: steps.diff.outputs.changed == 'true'

      - run: nix flake check
        if: steps.diff.outputs.changed == 'true'

      - name: Commit and push changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump versions.json"
          git push
