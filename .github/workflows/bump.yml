name: Bump versions

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    shell: nu {0}

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c # v3.29
        with:
          version: "0.116"

      - name: Run update script
        run: nu update.nu

      - name: Check for changes
        id: diff
        run: |
          let changed = (git diff --quiet versions.json | complete).exit_code != 0
          $"changed=($changed)\n" | save --append $env.GITHUB_OUTPUT
          if $changed { git --no-pager diff versions.json }

      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3.24.1
        if: steps.diff.outputs.changed == 'true'

      - run: nix flake check
        if: steps.diff.outputs.changed == 'true'

      - name: Commit and push changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump versions.json"
          git push
